name: Tests and packaging

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and build tooling
        run: python -m pip install -e . build
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check installed wheel outside source tree
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          wifi-scout scan --demo --json > wifi-scout-demo.json
          python -c 'import json; from importlib.resources import files; report=json.load(open("wifi-scout-demo.json")); assert report["scan"]["mode"] == "demo"; assert report["scan"]["networks"]; assert files("wifi_scout").joinpath("static/index.html").is_file()'

  replay-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the offline decoder and project
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          python -m pip install .
      - name: Run native decoder tests and ten-concern replay lab
        run: |
          python -m unittest discover -s tests -v
          wifi-scout lab --output lab-results
          wifi-scout stress-lab --output stress-results --seed 7
          wifi-scout doctor --json > stress-results/environment.json
      - name: Preserve inspectable lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wifi-scout-replay-lab
          path: |
            lab-results/
            stress-results/
